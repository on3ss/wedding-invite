<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merciful & Leky - Wedding Invitation</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --dusty-rose: #C28C8E;
            --sage-green: #839788;
            --text-dark: #5A5A5A;
            --bg-color: #FDFCFB;
            --dusty-rose-dark: #a67375;
            --sage-green-dark: #5d6e61;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevents scrolling entirely on all devices */
        body,
        html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Noise Texture for Cardstock Feel */
        .texture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Subtle radial glow */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(194, 140, 142, 0.15) 0%, rgba(253, 252, 251, 0) 65%);
            z-index: 2;
            pointer-events: none;
        }

        /* Canvas for optimized animation */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* =========================================
           MOBILE FIRST BASE STYLES (Un-squished)
           ========================================= */
        .content-wrapper {
            position: relative;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 1rem;
            perspective: 1500px;
        }

        /* Elegant Invitation Card */
        .invite-card {
            background-image: url('assets/bg.jpeg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;

            border: 1px solid rgba(194, 140, 142, 0.3);
            border-radius: 8px;

            /* Perfectly matches the 11:14 ratio of the image */
            aspect-ratio: 11 / 14;
            width: 100%;
            max-width: 96vw;
            /* Slightly wider on mobile */
            max-height: 96dvh;

            /* Reduced outer padding to let the glass box be larger */
            padding: 1rem;

            display: flex;
            flex-direction: column;
            justify-content: center;

            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out, box-shadow 0.5s ease;
            user-select: none;

            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* The glass layer that protects the text from the flowers */
        .card-content {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transform: translateZ(30px);

            /* Significantly increased padding and gap for breathing room */
            padding: 2.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* Wrap the left and right sections with flex for even spacing */
        .left-col,
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Mobile Typography */
        .pre-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.6rem, 3vw, 0.85rem);
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--sage-green);
            text-transform: uppercase;
            line-height: 1.4;
        }

        .names {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 9vw, 3.5rem);
            font-weight: 600;
            color: var(--dusty-rose);
            line-height: 1.1;
            letter-spacing: 2px;
            cursor: default;
            transition: text-shadow 0.4s ease, letter-spacing 0.4s ease;
        }

        .names span {
            font-size: clamp(1.4rem, 6vw, 2rem);
            color: var(--sage-green);
            display: block;
            margin: 0.3rem 0;
            transition: color 0.4s ease;
        }

        /* Countdown Timer */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 4px;
            border-radius: 4px;
            border: 1px solid rgba(194, 140, 142, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .time-block span:first-child {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.1rem, 4.5vw, 1.3rem);
            font-weight: 600;
            color: var(--dusty-rose);
        }

        .time-block span:last-child {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.5rem, 2.2vw, 0.6rem);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--sage-green);
            margin-top: 2px;
        }

        .save-the-date {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            font-style: italic;
            font-weight: 600;
            color: var(--dusty-rose);
            margin-bottom: 0.2rem;
            letter-spacing: 1px;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.85rem, 3.8vw, 1.1rem);
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .location {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.75rem, 3.2vw, 0.9rem);
            font-weight: 600;
            line-height: 1.4;
            color: var(--sage-green-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .location-icon {
            width: clamp(18px, 5vw, 24px);
            height: clamp(18px, 5vw, 24px);
            fill: var(--dusty-rose);
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        /* Add to Calendar Button */
        .btn-calendar {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.65rem, 2.8vw, 0.75rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            color: #fff;
            padding: clamp(10px, 3vw, 12px) 15px;
            border: 1px solid var(--dusty-rose);
            border-radius: 30px;
            background: var(--dusty-rose);
            box-shadow: 0 4px 15px rgba(194, 140, 142, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =========================================
           DESKTOP & TABLET ENHANCEMENTS
           ========================================= */
        @media (min-width: 600px) {
            .content-wrapper {
                padding: 2rem;
            }

            .invite-card {
                max-width: min(550px, 90vw, calc(90dvh * 11 / 14));
                padding: 2.5rem;
            }

            .card-content {
                padding: 3rem 2rem;
                gap: 2rem;
            }

            .left-col,
            .right-col {
                gap: 1.5rem;
            }

            .countdown {
                gap: 10px;
                max-width: 360px;
            }

            .time-block {
                padding: 12px;
            }

            @media (hover: hover) {
                .invite-card:hover {
                    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.05);
                }

                .names:hover {
                    text-shadow: 0 0 20px rgba(194, 140, 142, 0.5);
                    letter-spacing: 4px;
                }

                .names:hover span {
                    color: var(--sage-green-dark);
                }

                .time-block:hover {
                    transform: translateY(-4px);
                    box-shadow: 0 8px 15px rgba(194, 140, 142, 0.15);
                    border-color: rgba(194, 140, 142, 0.6);
                }

                .location:hover {
                    transform: translateY(-2px);
                    color: var(--dusty-rose-dark);
                }

                .location:hover .location-icon {
                    transform: translateY(-3px) scale(1.1);
                    fill: var(--dusty-rose-dark);
                }

                .btn-calendar:hover {
                    background: var(--dusty-rose-dark);
                    border-color: var(--dusty-rose-dark);
                    box-shadow: 0 8px 20px rgba(194, 140, 142, 0.5);
                    transform: translateY(-3px);
                }
            }
        }

        /* =========================================
           LANDSCAPE / SHORT SCREEN OVERRIDES
           ========================================= */
        @media (max-height: 500px) and (orientation: landscape) {
            .invite-card {
                aspect-ratio: auto;
                max-width: 85vw;
                max-height: 92dvh;
                padding: 1rem;
                border-radius: 6px;
            }

            .card-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1.5rem;
                padding: 1.2rem;
            }

            .left-col,
            .right-col {
                gap: 0.8rem;
            }

            .pre-title {
                display: none;
            }

            .names {
                font-size: clamp(1.5rem, 5vw, 2.5rem);
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                max-width: 200px;
            }
        }
    </style>
</head>

<body>

    <div class="texture-overlay"></div>
    <div class="ambient-glow"></div>
    <canvas id="fxCanvas"></canvas>

    <div class="content-wrapper" id="interactionLayer">
        <div class="invite-card" id="tiltCard">

            <div class="card-content">

                <div class="left-col">
                    <p class="pre-title">We expect your presence<br>at our wedding</p>
                    <h1 class="names">
                        MERCIFUL
                        <span>&</span>
                        LEKY
                    </h1>
                </div>

                <div class="right-col">
                    <div class="countdown" id="countdown">
                        <div class="time-block"><span id="days">00</span><span>Days</span></div>
                        <div class="time-block"><span id="hours">00</span><span>Hours</span></div>
                        <div class="time-block"><span id="minutes">00</span><span>Mins</span></div>
                        <div class="time-block"><span id="seconds">00</span><span>Secs</span></div>
                    </div>

                    <div>
                        <p class="save-the-date">Save the Date</p>
                        <p class="date">Thursday, January 7th 2027</p>
                    </div>

                    <a href="https://maps.google.com/?q=St+Claret+Church+Phramer+West+Jaintia+Hills" target="_blank"
                        rel="noopener" class="location">
                        <svg class="location-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                        </svg>
                        <p>St Claret Church, Phramer,<br>West Jaintia Hills</p>
                    </a>

                    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Merciful+%26+Leky%27s+Wedding&dates=20270107T100000Z/20270107T160000Z&details=We+expect+your+presence+at+our+wedding!&location=St+Claret+Church,+Phramer,+West+Jaintia+Hills"
                        target="_blank" rel="noopener" class="btn-calendar">
                        Add to Calendar
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        const tiltCard = document.getElementById('tiltCard');

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        let width, height;
        let elements = [];

        let mouse = { x: undefined, y: undefined, radius: 120 };

        window.addEventListener('pointermove', (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;

            if (!isTouchDevice) {
                const xAxis = (window.innerWidth / 2 - event.clientX) / 30;
                const yAxis = (window.innerHeight / 2 - event.clientY) / 30;
                tiltCard.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        }, { passive: true });

        window.addEventListener('pointerleave', () => {
            mouse.x = undefined;
            mouse.y = undefined;
            if (!isTouchDevice) {
                tiltCard.style.transform = `rotateY(0deg) rotateX(0deg)`;
            }
        });

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resize);
        resize();

        function applyMouseInteraction(particle) {
            if (mouse.x != undefined && mouse.y != undefined) {
                let dx = mouse.x - particle.x;
                let dy = mouse.y - particle.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0 && distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    const directionX = forceDirectionX * force * 3;
                    const directionY = forceDirectionY * force * 3;

                    particle.x -= directionX;
                    particle.y -= directionY;
                }
            }
        }

        class Petal {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20 - Math.random() * 50;
                this.size = Math.random() * 6 + 4;
                this.speed = Math.random() * 1 + 0.5;
                this.sway = Math.random() * 0.03;
                this.swayAmount = Math.random() * 1.5;
                this.angle = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.opacity = Math.random() * 0.4 + 0.3;
                this.flip = Math.random() * Math.PI * 2;
                this.flipSpeed = Math.random() * 0.05 + 0.02;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * this.sway) * this.swayAmount;
                this.angle += this.rotationSpeed;
                this.flip += this.flipSpeed;
                applyMouseInteraction(this);
                if (this.y > height + 20 || this.x < -20 || this.x > width + 20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.scale(Math.cos(this.flip), 1);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.size * 1.2, -this.size * 0.5, this.size * 1.2, -this.size * 2, 0, -this.size * 2.5);
                ctx.bezierCurveTo(-this.size * 1.2, -this.size * 2, -this.size * 1.2, -this.size * 0.5, 0, 0);

                ctx.fillStyle = `rgba(194, 140, 142, ${this.opacity})`;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -this.size * 0.2);
                ctx.quadraticCurveTo(this.size * 0.2, -this.size * 1.5, 0, -this.size * 2.3);
                ctx.strokeStyle = `rgba(166, 115, 117, ${this.opacity + 0.15})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Leaf {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20 - Math.random() * 50;
                this.size = Math.random() * 5 + 3;
                this.speed = Math.random() * 0.8 + 0.4;
                this.sway = Math.random() * 0.02;
                this.swayAmount = Math.random() * 2;
                this.angle = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.015;
                this.opacity = Math.random() * 0.4 + 0.25;
            }

            update() {
                this.y += this.speed;
                this.x += Math.cos(this.y * this.sway) * this.swayAmount;
                this.angle += this.rotationSpeed;
                applyMouseInteraction(this);
                if (this.y > height + 20 || this.x < -20 || this.x > width + 20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.beginPath();
                ctx.moveTo(0, -this.size * 2.5);
                ctx.bezierCurveTo(this.size * 1.5, -this.size * 1, this.size * 1.5, this.size, 0, this.size * 2.5);
                ctx.bezierCurveTo(-this.size * 1.5, this.size, -this.size * 1.5, -this.size * 1, 0, -this.size * 2.5);

                ctx.fillStyle = `rgba(131, 151, 136, ${this.opacity})`;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -this.size * 2.3);
                ctx.lineTo(0, this.size * 2.3);
                ctx.strokeStyle = `rgba(106, 124, 111, ${this.opacity + 0.2})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();

                ctx.lineWidth = 0.5;
                ctx.beginPath(); ctx.moveTo(0, -this.size * 1); ctx.lineTo(this.size * 0.8, -this.size * 0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(this.size * 1, this.size * 0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -this.size * 1); ctx.lineTo(-this.size * 0.8, -this.size * 0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-this.size * 1, this.size * 0.5); ctx.stroke();

                ctx.restore();
            }
        }

        class Bokeh {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 20 + Math.random() * 100;
                this.size = Math.random() * 4 + 1.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.4 + 0.1;

                const isRose = Math.random() > 0.5;
                this.color = isRose
                    ? `rgba(194, 140, 142, ${this.opacity})`
                    : `rgba(131, 151, 136, ${this.opacity})`;
            }

            update() {
                this.y -= this.speed;
                applyMouseInteraction(this);
                if (this.y < -20) this.reset();
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                let glowColor = this.color.replace(/[\d.]+\)$/g, `${this.opacity * 0.3})`);
                ctx.fillStyle = glowColor;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        const isMobileScreen = window.innerWidth < 768;

        const petalCount = isMobileScreen ? 35 : 65;
        const leafCount = isMobileScreen ? 20 : 40;
        const bokehCount = isMobileScreen ? 40 : 90;

        for (let i = 0; i < petalCount; i++) elements.push(new Petal());
        for (let i = 0; i < leafCount; i++) elements.push(new Leaf());
        for (let i = 0; i < bokehCount; i++) elements.push(new Bokeh());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            elements.forEach(el => {
                el.update();
                el.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        // --- Countdown Timer Logic ---
        const weddingDate = new Date("January 7, 2027 10:00:00").getTime();

        const timer = setInterval(function () {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<p style='font-family: Montserrat; color: var(--dusty-rose); font-weight: bold; width: 100%; grid-column: span 4;'>We are married!</p>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);
    </script>
</body>

</html>
